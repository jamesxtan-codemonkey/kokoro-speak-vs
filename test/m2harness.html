<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kokoro M2 webview harness</title>
</head>
<body>
  <!-- Mirror the elements src/extension.ts injects, and stub the VS Code API
       BEFORE the module loads so main.js can post state back to us. -->
  <p id="state">idle</p>
  <div class="row">
    <button id="pause" disabled>Pause</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="log"></div>
  <script>
    window.__posts = [];
    window.acquireVsCodeApi = () => ({
      postMessage: (m) => window.__posts.push(m),
    });
    window.__send = (m) => window.postMessage(m, "*");
    window.__lastState = () => {
      const s = window.__posts.filter((p) => p && p.type === "state");
      return s.length ? s[s.length - 1] : null;
    };
    window.__sawState = (name) =>
      window.__posts.some((p) => p && p.type === "state" && p.state === name);
  </script>
  <script type="module" src="/media/main.js"></script>
</body>
</html>
