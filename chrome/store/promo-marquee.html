<!DOCTYPE html>
<!-- Chrome Web Store marquee promo tile (1400×560): the small tile's design
     (promo-small.html) at twice the scale, with the name stacked beside the
     lines of text. `npm run test:chrome` renders it to
     chrome/test/out/promo-marquee.png. Uses the system font, so render it on a
     Mac to match the uploaded tile. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kokoro Speak marquee promo tile</title>
  <style>
    html, body { margin: 0; padding: 0; width: 1400px; height: 560px; overflow: hidden; background: #07266e; }
    svg { display: block; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="Kokoro Speak">
  <defs>
    <radialGradient id="bg" cx="40%" cy="8%" r="92%">
      <stop offset="0%" stop-color="#1a62d4"/>
      <stop offset="58%" stop-color="#0c3d9e"/>
      <stop offset="100%" stop-color="#07266e"/>
    </radialGradient>
    <filter id="goldGlow" x="-8%" y="-70%" width="116%" height="240%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)"/>
  <g fill="#ffffff" style="font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-size:104px;font-weight:700;letter-spacing:-0.03em">
    <text x="96" y="260">Kokoro</text>
    <text x="96" y="372">Speak</text>
  </g>
  <rect x="576" y="100" width="420" height="36" rx="18" fill="#ffffff" fill-opacity="0.44"/>
  <rect x="576" y="164" width="536" height="36" rx="18" fill="#ffffff" fill-opacity="0.44"/>
  <rect x="576" y="236" width="588" height="92" rx="26" fill="#ffc400" fill-opacity="0.5" filter="url(#goldGlow)"/>
  <rect x="576" y="236" width="588" height="92" rx="26" fill="#ffc400"/>
  <!-- The icon's bars (chrome/icons.mjs): heights 0.35, 0.7, 1, 0.7, 0.35 of 0.56. -->
  <svg x="1184" y="222" width="120" height="120" viewBox="0.22 0.22 0.56 0.56">
    <rect x="0.22" y="0.402" width="0.062222" height="0.196" rx="0.031111" fill="#ffc400"/>
    <rect x="0.344444" y="0.304" width="0.062222" height="0.392" rx="0.031111" fill="#ffc400"/>
    <rect x="0.468888" y="0.22" width="0.062222" height="0.56" rx="0.031111" fill="#ffc400"/>
    <rect x="0.593332" y="0.304" width="0.062222" height="0.392" rx="0.031111" fill="#ffc400"/>
    <rect x="0.717776" y="0.402" width="0.062222" height="0.196" rx="0.031111" fill="#ffc400"/>
  </svg>
  <rect x="576" y="360" width="500" height="36" rx="18" fill="#ffffff" fill-opacity="0.44"/>
  <rect x="576" y="424" width="352" height="36" rx="18" fill="#ffffff" fill-opacity="0.44"/>
</svg>
</body>
</html>
